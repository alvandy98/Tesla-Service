backend:
  name: github
  repo: alvandy98/Tesla-Service
  branch: main
  base_url: https://procode-cms-auth.alvandy98.workers.dev
  auth_endpoint: /auth

local_backend: true

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  - name: "site"
    label: "Business Information"
    files:
      - label: "Business Details"
        name: "business"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Business name"
            name: "name"
            widget: "string"

          - label: "Short logo name"
            name: "shortName"
            widget: "string"

          - label: "Displayed phone"
            name: "phoneDisplay"
            widget: "string"

          - label: "Phone link"
            name: "phoneLink"
            widget: "string"
            hint: "Example: +13854778598"

          - label: "Email"
            name: "email"
            widget: "string"
            required: false

          - label: "City / service area"
            name: "city"
            widget: "string"

          - label: "Hours"
            name: "hours"
            widget: "string"

          - label: "Tagline"
            name: "tagline"
            widget: "text"

          - label: "Homepage headline"
            name: "heroTitle"
            widget: "string"
            required: false

          - label: "Homepage introduction"
            name: "heroText"
            widget: "text"
            required: false

      - label: "Repair Services"
        name: "services"
        file: "content/services.json"
        format: "json"
        fields:
          - label: "Repair introduction"
            name: "intro"
            widget: "text"

          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "Service name"
                name: "name"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Short label"
                name: "icon"
                widget: "string"
                required: false

  - name: "inventory"
    label: "Vehicle Inventory"
    files:
      - label: "All Vehicles"
        name: "vehicles"
        file: "content/inventory.json"
        format: "json"

        fields:
          - label: "Vehicles"
            name: "vehicles"
            widget: "list"
            summary: "{{fields.year}} {{fields.make}} {{fields.model}} {{fields.trim}} — {{fields.status}}"

            fields:
              - label: "ID / URL slug"
                name: "id"
                widget: "string"
                hint: "Lowercase with hyphens and no spaces. Example: 2023-tesla-model-3-performance"

              - label: "Year"
                name: "year"
                widget: "number"
                value_type: "int"

              - label: "Make"
                name: "make"
                widget: "string"

              - label: "Model"
                name: "model"
                widget: "string"

              - label: "Trim"
                name: "trim"
                widget: "string"
                required: false

              - label: "Price"
                name: "price"
                widget: "number"
                value_type: "int"
                required: false
                default: 0

              - label: "Mileage"
                name: "mileage"
                widget: "number"
                value_type: "int"
                required: false
                default: 0

              - label: "Title status"
                name: "title"
                widget: "string"
                hint: "Use the title status exactly as shown on the vehicle's current legal title."

              - label: "Drivetrain"
                name: "drivetrain"
                widget: "string"
                required: false

              - label: "Transmission"
                name: "transmission"
                widget: "string"
                required: false

              - label: "Exterior color"
                name: "exterior"
                widget: "string"
                required: false

              - label: "Interior color"
                name: "interior"
                widget: "string"
                required: false

              - label: "Stock number"
                name: "stock"
                widget: "string"

              - label: "VIN"
                name: "vin"
                widget: "string"
                hint: "Enter the full VIN or use Available upon request."

              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - "Available"
                  - "Coming Soon"
                  - "Sale Pending"
                  - "Sold"

              - label: "Show on homepage"
                name: "featured"
                widget: "boolean"
                default: false

              - label: "Main photo"
                name: "image"
                widget: "image"
                choose_url: false

              - label: "Photo gallery"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"
                  choose_url: false

              - label: "Short description"
                name: "description"
                widget: "text"
                hint: "Used on inventory cards and as a fallback on the vehicle page."

              - label: "Full vehicle overview"
                name: "overview"
                widget: "text"
                required: false
                hint: "A polished introduction for the premium vehicle detail page."

              - label: "Features and highlights"
                name: "features"
                widget: "list"
                required: false
                field:
                  label: "Feature"
                  name: "feature"
                  widget: "string"

              - label: "ProCode inspection checklist"
                name: "inspection"
                widget: "list"
                required: false
                hint: "Only include items that were actually inspected or verified."
                field:
                  label: "Inspection item"
                  name: "item"
                  widget: "string"

              - label: "Restoration summary"
                name: "restorationSummary"
                widget: "text"
                required: false
                hint: "Explain prior damage and completed repairs clearly and accurately."

              - label: "Why we chose this vehicle"
                name: "whyWeChose"
                widget: "text"
                required: false

              - label: "Technician / team note"
                name: "technicianNote"
                widget: "text"
                required: false

              - label: "Vehicle disclosure"
                name: "disclosure"
                widget: "text"
                required: false
                hint: "Include title history, known issues, remaining concerns, or other important disclosures."

              - label: "Range"
                name: "range"
                widget: "string"
                required: false
                hint: "Example: 315-mile original EPA estimate when new"

              - label: "Wheels"
                name: "wheels"
                widget: "string"
                required: false
                hint: "Example: 20-inch Überturbine wheels"